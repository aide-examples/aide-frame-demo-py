<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIDE Frame Demo</title>
    <link rel="stylesheet" href="/static/frame/css/base.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }
        .demo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .demo-btn {
            padding: 20px;
            text-align: left;
            border: 1px solid #e0e0e0;
            background: #fff;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: block;
            text-decoration: none;
        }
        .demo-btn:hover {
            border-color: #2563eb;
            background: #f9fafb !important;
        }
        .demo-btn:hover h3 { color: #1d4ed8; }
        .demo-btn:hover p { color: #333; }
        .demo-btn.active {
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
        }
        .demo-btn h3 {
            margin: 0 0 8px 0;
            color: #2563eb;
        }
        .demo-btn p {
            margin: 0;
            font-size: 0.85em;
            color: #666;
        }
        .demo-panel {
            display: none;
            padding: 20px;
            border: 1px solid #e0e0e0;
            background: #fff;
            border-radius: 12px;
        }
        .demo-panel.active { display: block; }
        .demo-panel h2 { margin-top: 0; color: #333; }
        .demo-panel p { color: #666; }
        .result-box {
            margin-top: 16px;
            padding: 12px;
            background: #f3f4f6;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.9em;
            white-space: pre-wrap;
            color: #333;
            display: none;
        }
        .result-box.show { display: block; }
        .action-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div id="app-header"></div>

        <p id="app-subtitle" style="color: var(--text-secondary); margin-bottom: 24px;"></p>

        <div class="demo-grid" id="demo-grid"></div>

        <!-- HTTP Call Demo -->
        <div class="demo-panel" id="panel-http_call">
            <h2 data-i18n="http_title"></h2>
            <p data-i18n="http_desc"></p>
            <div class="form-group">
                <input type="text" id="http-name" data-i18n-placeholder="http_placeholder">
            </div>
            <button onclick="runHttpDemo()" class="wide" data-i18n="http_button"></button>
            <div class="result-box" id="http-result"></div>
        </div>

        <!-- Config Demo -->
        <div class="demo-panel" id="panel-config">
            <h2 data-i18n="config_title"></h2>
            <p data-i18n="config_desc"></p>
            <div class="action-btns">
                <button onclick="runConfigDemo('show_paths')" data-i18n="config_paths"></button>
                <button onclick="runConfigDemo('load_config')" data-i18n="config_load"></button>
            </div>
            <div class="result-box" id="config-result"></div>
        </div>

        <!-- Logging Demo -->
        <div class="demo-panel" id="panel-logging">
            <h2 data-i18n="logging_title"></h2>
            <p data-i18n="logging_desc"></p>
            <div class="form-group">
                <label data-i18n="logging_level"></label>
                <select id="log-level" onchange="runLoggingDemo('set_level')">
                    <option value="DEBUG">DEBUG</option>
                    <option value="INFO" selected>INFO</option>
                    <option value="WARNING">WARNING</option>
                    <option value="ERROR">ERROR</option>
                </select>
            </div>
            <button onclick="runLoggingDemo('log')" class="wide" data-i18n="logging_send"></button>
            <div class="result-box" id="logging-result"></div>
        </div>

        <!-- QR Code Demo -->
        <div class="demo-panel" id="panel-qrcode">
            <h2 data-i18n="qr_title"></h2>
            <p data-i18n="qr_desc"></p>
            <p style="font-size: 0.85em; color: #888;" data-i18n="qr_requires"></p>
            <div class="form-group">
                <input type="text" id="qr-text" data-i18n-placeholder="qr_placeholder">
            </div>
            <button onclick="runQrDemo()" class="wide" data-i18n="qr_button"></button>
            <div id="qr-result" style="display: none; margin-top: 16px; text-align: center;">
                <img id="qr-image" style="max-width: 200px; image-rendering: pixelated;">
            </div>
        </div>

        <!-- Status Widget -->
        <div id="status-widget" style="margin-top: 20px;"></div>
    </div>

    <script src="/static/frame/js/polyglot.min.js"></script>
    <script src="/static/frame/js/i18n.js"></script>
    <script src="/static/frame/js/header-widget.js"></script>
    <script src="/static/frame/js/status-widget.js"></script>
    <script>
        // DEMOS config - uses i18n keys
        const DEMO_CONFIG = {
            http_call: { titleKey: 'demo_http', descKey: 'demo_http_desc' },
            config: { titleKey: 'demo_config', descKey: 'demo_config_desc' },
            logging: { titleKey: 'demo_logging', descKey: 'demo_logging_desc' },
            qrcode: { titleKey: 'demo_qrcode', descKey: 'demo_qrcode_desc' },
            markdown: { titleKey: 'demo_markdown', descKey: 'demo_markdown_desc', link: '/sample_docs?doc=markdown-demo.md' }
        };

        let activeDemo = null;

        function initDemoGrid() {
            const grid = document.getElementById('demo-grid');
            for (const [key, cfg] of Object.entries(DEMO_CONFIG)) {
                const title = i18n.t(cfg.titleKey);
                const desc = i18n.t(cfg.descKey);

                if (cfg.link) {
                    // Link-based demo - navigate to page
                    const a = document.createElement('a');
                    a.className = 'demo-btn';
                    a.href = cfg.link;
                    a.innerHTML = `<h3>${title}</h3><p>${desc}</p>`;
                    grid.appendChild(a);
                } else {
                    // Panel-based demo
                    const btn = document.createElement('button');
                    btn.className = 'demo-btn';
                    btn.id = `btn-${key}`;
                    btn.innerHTML = `<h3>${title}</h3><p>${desc}</p>`;
                    btn.onclick = () => selectDemo(key);
                    grid.appendChild(btn);
                }
            }
        }

        function selectDemo(key) {
            // Update buttons
            document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${key}`).classList.add('active');

            // Update panels
            document.querySelectorAll('.demo-panel').forEach(p => p.classList.remove('active'));
            document.getElementById(`panel-${key}`).classList.add('active');

            activeDemo = key;
        }

        async function callDemo(demoName, data) {
            const res = await fetch(`/api/demo/${demoName}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            return res.json();
        }

        function showResult(elementId, data) {
            const el = document.getElementById(elementId);
            el.textContent = JSON.stringify(data, null, 2);
            el.classList.add('show');
        }

        async function runHttpDemo() {
            const name = document.getElementById('http-name').value.trim();
            if (!name) { alert(i18n.t('please_enter_name')); return; }
            const result = await callDemo('http_call', { name });
            showResult('http-result', result);
        }

        async function runConfigDemo(action) {
            const result = await callDemo('config', { action });
            showResult('config-result', result);
        }

        async function runLoggingDemo(action) {
            const level = document.getElementById('log-level').value;
            const data = { action, level };
            if (action === 'log') {
                data.message = `Test ${level} message from demo UI`;
            }
            const result = await callDemo('logging', data);
            showResult('logging-result', result);
        }

        async function runQrDemo() {
            const text = document.getElementById('qr-text').value.trim();
            if (!text) { alert(i18n.t('please_enter_text')); return; }
            const result = await callDemo('qrcode', { text });
            if (result.image) {
                document.getElementById('qr-image').src = result.image;
                document.getElementById('qr-result').style.display = 'block';
            } else if (result.error) {
                alert(result.error);
            }
        }

        // Apply i18n to elements with data-i18n attributes
        function applyI18n() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = i18n.t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = i18n.t(el.dataset.i18nPlaceholder);
            });
        }

        // Initialize
        (async () => {
            await i18n.init();
            document.title = i18n.t('app_title');
            document.getElementById('app-subtitle').textContent = i18n.t('app_subtitle');
            applyI18n();
            initDemoGrid();
            HeaderWidget.init('#app-header', { appName: i18n.t('app_title') });
            StatusWidget.init('#status-widget');
        })();
    </script>
</body>
</html>
