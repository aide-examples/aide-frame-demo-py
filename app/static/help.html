<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Help - Hello</title>
    <link rel="stylesheet" href="/static/base.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .help-container {
            display: flex;
            flex: 1;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .help-nav {
            width: 200px;
            padding: 1rem;
            border-right: 1px solid var(--border);
            flex-shrink: 0;
        }
        .help-nav a {
            display: block;
            padding: 0.5rem;
            color: var(--text);
            text-decoration: none;
            border-radius: 4px;
        }
        .help-nav a:hover {
            background: var(--surface);
        }
        .help-nav a.active {
            background: var(--primary);
            color: white;
        }
        .help-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }
        .help-content h1 { margin-top: 0; }
        .help-content h2 { margin-top: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .help-content table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .help-content th, .help-content td { padding: 0.5rem; border: 1px solid var(--border); text-align: left; }
        .help-content th { background: var(--surface); }
        .help-content code { background: var(--surface); padding: 0.2rem 0.4rem; border-radius: 3px; }
        .help-content pre { background: var(--surface); padding: 1rem; border-radius: 4px; overflow-x: auto; }
        .help-content pre code { background: none; padding: 0; }
    </style>
</head>
<body>
    <div class="container wide">
        <div class="header">
            <h1>Help</h1>
            <div>
                <a href="/" class="header-link">Home</a>
            </div>
        </div>
    </div>
    <div class="help-container">
        <nav class="help-nav" id="nav"></nav>
        <main class="help-content" id="content">
            <p>Loading...</p>
        </main>
    </div>
    <script>
        const nav = document.getElementById('nav');
        const content = document.getElementById('content');
        let currentFile = 'index.md';

        async function loadStructure() {
            const res = await fetch('/api/help/structure');
            const data = await res.json();

            nav.innerHTML = data.files.map(f =>
                `<a href="#" data-file="${f.path}" class="${f.path === currentFile ? 'active' : ''}">${f.title}</a>`
            ).join('');

            nav.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', (e) => {
                    e.preventDefault();
                    loadFile(a.dataset.file);
                });
            });
        }

        async function loadFile(filename) {
            currentFile = filename;

            // Update nav active state
            nav.querySelectorAll('a').forEach(a => {
                a.classList.toggle('active', a.dataset.file === filename);
            });

            // Load and render content
            const res = await fetch(`/api/help/${filename}`);
            if (res.ok) {
                const md = await res.text();
                content.innerHTML = marked.parse(md);
            } else {
                content.innerHTML = '<p>Error loading help content.</p>';
            }

            // Update URL
            history.replaceState(null, '', `/help?doc=${filename}`);
        }

        // Initialize
        const params = new URLSearchParams(window.location.search);
        if (params.get('doc')) {
            currentFile = params.get('doc');
        }

        loadStructure().then(() => loadFile(currentFile));
    </script>
</body>
</html>
